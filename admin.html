<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermaScan AI — Feedback Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #111128;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(124, 92, 255, 0.3);
            --text-primary: #f0f0ff;
            --text-secondary: #a0a0c8;
            --text-muted: #6b6b8d;
            --accent-primary: #7c5cff;
            --accent-secondary: #ff6b9d;
            --accent-tertiary: #00d4aa;
            --gradient-primary: linear-gradient(135deg, #7c5cff, #ff6b9d);
            --gradient-cool: linear-gradient(135deg, #00d4aa, #00b4d8);
            --gradient-bg: linear-gradient(180deg, #0a0a1a 0%, #111128 50%, #0d0d24 100%);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --radius-full: 100px;
            --shadow-lg: 0 16px 64px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(124, 92, 255, 0.2);
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Outfit', 'Inter', sans-serif;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-primary);
            background: var(--gradient-bg);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 10px; }

        /* Header */
        .admin-header {
            padding: 24px 40px;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            text-decoration: none;
        }

        .brand-icon { font-size: 1.5em; }

        .brand-text {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-highlight {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-badge {
            padding: 6px 16px;
            border-radius: var(--radius-full);
            font-size: 0.78em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(124, 92, 255, 0.12);
            border: 1px solid rgba(124, 92, 255, 0.3);
            color: var(--accent-primary);
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
            padding: 8px 20px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--text-primary);
            border-color: var(--accent-primary);
            background: rgba(124, 92, 255, 0.08);
        }

        /* Main */
        .admin-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 2.2em;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1em;
            margin-bottom: 36px;
        }

        .gradient-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .stat-card:nth-child(1)::before { background: var(--gradient-primary); }
        .stat-card:nth-child(2)::before { background: var(--gradient-cool); }
        .stat-card:nth-child(3)::before { background: linear-gradient(135deg, #ffd200, #f7971e); }
        .stat-card:nth-child(4)::before { background: linear-gradient(135deg, #ff6b9d, #ee5a24); }

        .stat-card:hover {
            border-color: var(--border-glow);
            box-shadow: var(--shadow-glow);
            transform: translateY(-4px);
        }

        .stat-emoji {
            font-size: 2em;
            margin-bottom: 12px;
            display: block;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 2.4em;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.85em;
            font-weight: 500;
            margin-top: 4px;
        }

        /* Rating Distribution */
        .distribution-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .dist-label {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 50px;
            text-align: right;
        }

        .dist-track {
            flex: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .dist-fill {
            height: 100%;
            border-radius: var(--radius-full);
            transition: width 0.8s ease;
            min-width: 2px;
        }

        .dist-fill-5 { background: var(--accent-tertiary); }
        .dist-fill-4 { background: #00b4d8; }
        .dist-fill-3 { background: #ffd200; }
        .dist-fill-2 { background: #ffa726; }
        .dist-fill-1 { background: #ef5350; }

        .dist-count {
            font-size: 0.8em;
            color: var(--text-muted);
            min-width: 30px;
        }

        /* Sections */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.4em;
            font-weight: 700;
        }

        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
            background: rgba(124, 92, 255, 0.08);
        }

        .refresh-btn.spinning .refresh-icon {
            animation: spin 0.8s linear;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px;
        }

        /* Feedbacks Table */
        .feedbacks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .feedback-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 20px;
            transition: all 0.2s ease;
        }

        .feedback-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-glow);
        }

        .feedback-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .feedback-stars {
            display: flex;
            gap: 3px;
        }

        .feedback-star {
            font-size: 1.1em;
        }

        .feedback-star.filled { color: #ffd200; }
        .feedback-star.empty { color: var(--text-muted); opacity: 0.3; }

        .feedback-date {
            font-size: 0.78em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .feedback-id {
            font-size: 0.7em;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: var(--radius-full);
            font-weight: 600;
        }

        .feedback-comment {
            color: var(--text-secondary);
            font-size: 0.92em;
            line-height: 1.6;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 3.5em;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-family: var(--font-display);
            font-size: 1.3em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        /* Loading */
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(124, 92, 255, 0.2);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .admin-header { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
            .admin-main { padding: 24px 20px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .page-title { font-size: 1.6em; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="admin-header">
        <div class="header-left">
            <a href="index.html" class="brand">
                <span class="brand-icon">🧬</span>
                <span class="brand-text">Derma<span class="brand-highlight">Scan</span> AI</span>
            </a>
            <span class="header-badge">Admin Dashboard</span>
        </div>
        <a href="index.html" class="back-link">← Back to Site</a>
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <h1 class="page-title">Feedback <span class="gradient-text">Dashboard</span></h1>
        <p class="page-subtitle">View and analyze all user feedback submissions</p>

        <!-- Stats Cards -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <span class="stat-emoji">📝</span>
                <div class="stat-value" id="stat-total">—</div>
                <div class="stat-label">Total Feedbacks</div>
            </div>
            <div class="stat-card">
                <span class="stat-emoji">⭐</span>
                <div class="stat-value" id="stat-avg">—</div>
                <div class="stat-label">Average Rating</div>
            </div>
            <div class="stat-card">
                <span class="stat-emoji">🏆</span>
                <div class="stat-value" id="stat-five">—</div>
                <div class="stat-label">5-Star Reviews</div>
            </div>
            <div class="stat-card">
                <span class="stat-emoji">📅</span>
                <div class="stat-value" id="stat-latest">—</div>
                <div class="stat-label">Latest Feedback</div>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="content-grid">
            <!-- Feedbacks List -->
            <div class="card">
                <div class="section-header">
                    <h2 class="section-title">📋 All Feedbacks</h2>
                    <button class="refresh-btn" id="refresh-btn" onclick="loadDashboard()">
                        <span class="refresh-icon">🔄</span> Refresh
                    </button>
                </div>
                <div id="feedbacks-container">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Rating Distribution -->
            <div class="card">
                <div class="section-header">
                    <h2 class="section-title">📊 Rating Breakdown</h2>
                </div>
                <div id="distribution-container">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function loadDashboard() {
            const refreshBtn = document.getElementById('refresh-btn');
            refreshBtn.classList.add('spinning');

            try {
                // Load stats
                const statsRes = await fetch('/api/feedbacks/stats');
                const stats = await statsRes.json();

                document.getElementById('stat-total').textContent = stats.total;
                document.getElementById('stat-avg').textContent = stats.average_rating > 0 ? stats.average_rating + '/5' : '—';
                document.getElementById('stat-five').textContent = stats.distribution['5'] || 0;

                // Rating distribution
                const distContainer = document.getElementById('distribution-container');
                const maxCount = Math.max(...Object.values(stats.distribution).map(Number), 1);
                let distHTML = '';

                for (let i = 5; i >= 1; i--) {
                    const count = stats.distribution[String(i)] || 0;
                    const percent = (count / maxCount) * 100;
                    distHTML += `
                        <div class="distribution-bar">
                            <span class="dist-label">${'★'.repeat(i)}</span>
                            <div class="dist-track">
                                <div class="dist-fill dist-fill-${i}" style="width: ${percent}%"></div>
                            </div>
                            <span class="dist-count">${count}</span>
                        </div>
                    `;
                }
                distContainer.innerHTML = distHTML;

                // Load feedbacks
                const fbRes = await fetch('/api/feedbacks');
                const fbData = await fbRes.json();
                const container = document.getElementById('feedbacks-container');

                // Update latest date
                if (fbData.feedbacks.length > 0) {
                    const latest = fbData.feedbacks[0].created_at;
                    const d = new Date(latest);
                    document.getElementById('stat-latest').textContent =
                        d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
                } else {
                    document.getElementById('stat-latest').textContent = '—';
                }

                if (fbData.feedbacks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">💬</div>
                            <h3>No Feedbacks Yet</h3>
                            <p>User feedback submissions will appear here.</p>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="feedbacks-list">';
                fbData.feedbacks.forEach(fb => {
                    const stars = Array.from({ length: 5 }, (_, i) =>
                        `<span class="feedback-star ${i < fb.rating ? 'filled' : 'empty'}">★</span>`
                    ).join('');

                    const date = new Date(fb.created_at);
                    const dateStr = date.toLocaleDateString('en-IN', {
                        day: 'numeric', month: 'short', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });

                    html += `
                        <div class="feedback-item">
                            <div class="feedback-top">
                                <div class="feedback-stars">${stars}</div>
                                <span class="feedback-id">#${fb.id}</span>
                            </div>
                            <p class="feedback-comment">${escapeHTML(fb.comments)}</p>
                            <div class="feedback-date" style="margin-top: 10px;">🕒 ${dateStr}</div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } catch (err) {
                console.error('Failed to load dashboard:', err);
                document.getElementById('feedbacks-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <h3>Connection Error</h3>
                        <p>Make sure the server is running with: <code>python3 server.py</code></p>
                    </div>
                `;
            } finally {
                setTimeout(() => refreshBtn.classList.remove('spinning'), 500);
            }
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Load on page ready
        loadDashboard();
    </script>

</body>

</html>
